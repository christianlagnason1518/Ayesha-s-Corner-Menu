<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #fff8f0;
        }

        header {
            background: #8b0000;
            color: white;
            text-align: center;
            padding: 30px 10px;
        }

        header h1 {
            margin: 0;
        }

        .menu {
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .category {
            color: #8b0000;
            border-bottom: 2px solid #8b0000;
            padding-bottom: 8px;
            margin-top: 30px;
        }

        .item {
            background: white;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 3px 8px #ddd;
        }

        .item h3 {
            margin: 0 0 5px;
        }

        .item p {
            margin: 0;
            color: #777;
        }

        .price {
            color: #8b0000;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

<header>
    <h1>🍽️ OUR MENU</h1>
    <p>Welcome! Scan, choose, and enjoy.</p>
</header>

<div class="menu">

    <h2 class="category">🍛 Main Dishes</h2>

    <div class="item">
        <div>
            <h3>Chicken Adobo</h3>
            <p>Chicken adobo with rice</p>
        </div>
        <span class="price">₱120</span>
    </div>

    <div class="item">
        <div>
            <h3>Pork Sinigang</h3>
            <p>Filipino sour soup with pork</p>
        </div>
        <span class="price">₱150</span>
    </div>

    <h2 class="category">🍟 Snacks</h2>

    <div class="item">
        <div>
            <h3>French Fries</h3>
            <p>Crispy golden fries</p>
        </div>
        <span class="price">₱80</span>
    </div>

    <h2 class="category">🥤 Drinks</h2>

    <div class="item">
        <div>
            <h3>Iced Tea</h3>
            <p>Refreshing iced tea</p>
        </div>
        <span class="price">₱50</span>
    </div>

</div>

</body>
</html>
